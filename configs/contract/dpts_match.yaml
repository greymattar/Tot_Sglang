seed: 12345

dpts_config:
  lambda_es: 0.8
  lambda_ds: 0.8
  t_star: 5

  tree_width: 4
  tree_depth: 16
  num_branch : 4

  max_new_tokens_global: 4096
  max_new_tokens: 4096
  max_rollout: 20
  max_step_time_s: 5000
  max_step_time: 5000
  mini_step: true
  max_candidates: 10
  priority_mode: prm_nll_hybrid
  nll_lambda: 0.0
  nll_norm_mode: welford_global
  nll_token_filter_mode: math_tokens
  logprobs_required: true


  verifier:
    enabled: false
    model_id: "GenPRM/GenPRM-7B"
    dtype: "bfloat16"
    device: "cuda:1"
    topk_groups: 6
    reps_per_group: 2
    alpha_vote: 0.5
    samples_per_candidate: 5
    max_new_tokens: 192
    temperature: 0.7
    top_p: 0.9

  early_stop:
    enabled: false
    every_expansions: 50
    tau_abs: 0.92
    tau_margin: 0.08
    streak: 2
    min_unique_answers: 3

llm_config:
  # match DPTS run
  max_new_tokens_per_expand: 100
  max_new_tokens: 100
  do_sample: true
  num_beams: 1
  temperature: 1.0
  top_p: 0.9

prm_config: {}  
dataset:
  slice_path: "data/math500_gsm8k_format.jsonl"

generator:
  
  model_id: "meta-llama/Llama-3.1-8B-Instruct"
  dtype: "bfloat16"

prm:
  backend: "math_shepherd"
  model_id: "peiyi9979/math-shepherd-mistral-7b-prm"
  prm_dtype: "float16"
  device: "cuda:0"
  step_tag: "ки"
  good_token: "+"
  bad_token: "-"
  aggregation: "min"
  tau: 0.90
accounting:
  # Standardized token accounting (oneacross backends)
  include_prompt_tokens_in_total: false
  count_prefill_as_generated: false
  token_counting_method: "retokenize_delta"

debug:
    trace_dir: "runlogs/traces_smoke"
    trace_problem_ids:
      - "gsm8k_test_00000_2b2e3f9639f6fa28"
      - "gsm8k_test_00001_de563650cee0d9af"
      - "gsm8k_test_00002_d3c6224db7dd6691"
